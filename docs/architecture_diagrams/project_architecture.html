  <style>

    .subtitle { margin-bottom: 22px; color: var(--muted); font-size: 14px; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 1200px; }
    @media print { body { padding: 16px; } .diagram-container { overflow: visible; } svg { min-width: 0; } }
