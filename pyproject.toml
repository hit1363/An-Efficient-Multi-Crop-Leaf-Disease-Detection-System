[project]
name = "an-efficient-multi-crop-leaf-disease-detection-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
# Lowered to 3.10 to ensure TensorFlow and OpenCV compatibility
requires-python = ">=3.10,<3.13" 
dependencies = [
    "pillow>=12.3.0",
    "tensorflow>=2.16.1,<=2.19.1",
    "tensorflow-hub>=0.16,<1.0",
    "tf-keras>=2.16,<2.20",
    "keras>=3.0,<4.0",

    # Data Processing
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<3.0",
    "opencv-python>=4.10,<5.0",
    "scikit-learn>=1.5,<2.0",
    "scikit-image>=0.24,<1.0",

    # Data Augmentation
    "albumentations>=1.4,<3.0",

    # Visualization
    "matplotlib>=3.8,<4.0",
    "seaborn>=0.13,<1.0",
    "plotly>=5.20,<7.0",

    # Model Analysis
    "tensorboard>=2.16,<3.0",
    "keras-tuner>=1.4,<2.0",

    # Configuration
    "pyyaml>=6.0,<7.0",
    "omegaconf>=2.3,<3.0",

    # Utilities
    "tqdm>=4.66,<5.0",
    "click>=8.1,<9.0",
    "python-dotenv>=1.0,<2.0",

    # Jupyter Notebooks
    "jupyter>=1.0,<2.0",
    "ipykernel>=6.29,<7.0",
    "ipywidgets>=8.1,<9.0",

    # Model Optimization
    "tensorflow-model-optimization>=0.8,<1.0 ; python_version < '3.12'",

    # Image Processing
    "imageio>=2.34,<3.0",

    # Logging & Monitoring
    "mlflow>=2.12,<3.0",
    "wandb>=0.17,<1.0",

    # Testing
    "pytest>=8.2,<9.0",
    "pytest-cov>=5.0,<6.0",

    # Code Quality
    "black>=24.4,<26.0",
    "flake8>=7.0,<8.0",
    "pylint>=3.2,<4.0",

    # Documentation
    "sphinx>=7.3,<9.0",
    "sphinx-rtd-theme>=2.0,<4.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Include only folders that contain actual Python package code
include = ["models*", "training*", "quantization*"]
# Exclude folders that are only for data, notebooks, or outputs
exclude = ["dataset*", "notebooks*", "results*"]