# Training Configuration File (EfficientNet-Lite0)

# Model Settings
model:
  architecture: "efficientnet_lite0" # Options: mobilenetv2, efficientnet_b0, efficientnet_lite0, mobilenetv3_small, shufflenetv2_05
  input_shape: [224, 224, 3]
  num_classes: 45
  weights: "imagenet" # Use ImageNet pre-trained weights
  dropout_rate: 0.5
  # Optional TF Hub overrides
  hub_url: "https://tfhub.dev/tensorflow/efficientnet/lite0/feature-vector/2"
  hub_cache_dir: null # Use default TF Hub cache directory. Set to custom path if needed.
  hub_download_retries: 3
  hub_download_delay_sec: 5

# Dataset Settings
dataset:
  data_dir: "../dataset/processed"
  train_dir: "../dataset/processed/train"
  val_dir: "../dataset/processed/val"
  test_dir: "../dataset/processed/test"
  batch_size: 64
  shuffle_buffer: 1000
  cache_mode: "auto"

# Data Augmentation
augmentation:
  rotation_range: 20
  zoom_range: [0.9, 1.1]
  horizontal_flip: true
  vertical_flip: true
  brightness_range: [0.9, 1.1]

# Training Settings
training:
  epochs: 50
  freeze_base: true
  unfreeze_from_layer: 100 # Layer index to start unfreezing from
  unfreeze_epoch: 10 # Unfreeze after this epoch
  fine_tune_learning_rate: 0.0001

# Optimizer Settings
optimizer:
  name: "adam" # Options: adam, sgd, rmsprop
  learning_rate: 0.001
  beta_1: 0.9
  beta_2: 0.999
  epsilon: 1.0e-7
  decay: 0.0

# Learning Rate Schedule
# type: reduce_on_plateau (default) | exponential_decay | cosine_decay
#   reduce_on_plateau: uses factor, patience, min_lr (above)
#   exponential_decay: uses decay_steps, decay_rate, staircase
#   cosine_decay:     uses decay_steps, alpha (minimum LR fraction)
lr_schedule:
  type: "reduce_on_plateau" # Options: reduce_on_plateau, exponential_decay, cosine_decay
  monitor: "val_loss"
  factor: 0.5
  patience: 5
  min_lr: 1.0e-7
  # For exponential_decay:
  # decay_steps: 1000
  # decay_rate: 0.96
  # staircase: false
  # For cosine_decay:
  # decay_steps: 1000
  # alpha: 0.0

# Loss Function
loss:
  name: "categorical_crossentropy" # Options: categorical_crossentropy, focal_loss
  # For focal_loss only:
  # gamma: 2.0        # focusing parameter (higher = more focus on hard examples)
  # alpha: 0.25       # weight-balancing parameter
  # label_smoothing: 0.0

# Class Weights (for imbalanced dataset)
class_weights:
  enabled: true
  auto_compute: true # Automatically compute from dataset

# Callbacks
callbacks:
  # Model Checkpoint
  checkpoint:
    enabled: true
    monitor: "val_accuracy"
    save_best_only: true
    save_weights_only: true
    mode: "max"
    save_freq: "epoch"

  # Early Stopping
  early_stopping:
    enabled: true
    monitor: "val_loss"
    patience: 10
    restore_best_weights: true
    mode: "min"

  # TensorBoard
  tensorboard:
    enabled: true
    log_dir: "../logs"
    histogram_freq: 1
    write_graph: true
    write_images: false
    update_freq: "epoch"

  # CSV Logger
  csv_logger:
    enabled: true
    filename: "../results/training_log_efficientnet_lite0.csv"
    append: false

# Model Export
export:
  save_dir: "../models"
  formats: ["saved_model", "tflite"]
  sync_flutter_labels: false

# Evaluation Metrics
metrics:
  - "accuracy"
  - "precision"
  - "recall"
  - "auc"

# Reproducibility
seed: 42

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  save_to_file: true
  log_file: "../logs/training_efficientnet_lite0.log"

performance:
  mixed_precision: true
  steps_per_execution: 32
  jit_compile: false
  deterministic: false
  distribution: auto
  log_throughput: true
