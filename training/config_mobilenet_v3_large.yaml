# Shared benchmark training recipe for this architecture.
model:
  architecture: mobilenet_v3_large
  input_shape: [224, 224, 3]
  num_classes: 72
  weights: imagenet
  dropout_rate: 0.35
  classifier_units: 256
  include_preprocessing: true
dataset:
  data_dir: ../dataset/processed
  train_dir: ../dataset/processed/train
  val_dir: ../dataset/processed/val
  test_dir: ../dataset/processed/test
  batch_size: 32
  batch_size_fallbacks:
  - 32
  - 16
  auto_batch_fallback: true
  shuffle_buffer: 1000
  cache_mode: none
  cache_memory_limit_gb: 8.0
augmentation:
  rotation_range: 15
  zoom_range:
  - 0.95
  - 1.05
  horizontal_flip: true
  vertical_flip: false
  brightness_range:
  - 0.95
  - 1.05
  class_aware:
    enabled: true
    max_train_samples: 500
    rotation_range: 20
    zoom_range:
    - 0.9
    - 1.1
    horizontal_flip: true
    vertical_flip: true
    contrast_range: 0.15
    brightness_range:
    - 0.85
    - 1.15
training:
  fine_tuning:
    enabled: true
  epochs: 20
  log_mode: progress
  freeze_base: true
  unfreeze_from_layer: 100
  unfreeze_epoch: 5
  fine_tune_learning_rate: 1.0e-05
optimizer:
  name: adam
  learning_rate: 0.0003
  clipnorm: 1.0
  decay: 0.0
loss:
  name: categorical_crossentropy
lr_schedule:
  type: reduce_on_plateau
  monitor: val_loss
  factor: 0.5
  patience: 3
  min_lr: 1.0e-06
class_weights:
  enabled: true
  max_weight: 5.0
  normalize: true
callbacks:
  checkpoint:
    run_scoped: true
    enabled: true
    monitor: val_loss
    save_best_only: true
    save_weights_only: true
    mode: min
    save_freq: epoch
  early_stopping:
    enabled: true
    monitor: val_loss
    patience: 6
    restore_best_weights: true
    mode: min
  fine_tuning_early_stopping:
    monitor: val_loss
    patience: 6
    mode: min
    restore_best_weights: true
  tensorboard:
    enabled: false
  csv_logger:
    enabled: true
    append: false
    filename: ../results/training_log_mobilenet_v3_large.csv
export:
  save_dir: ../models
  formats:
  - saved_model
  sync_flutter_labels: false
metrics:
- accuracy
seed: 42
performance:
  validate_dataset_splits: true
  mixed_precision: true
  jit_compile: true
  deterministic: true
  distribution: auto
  finite_batch_check: true
  terminate_on_nan: true
  log_throughput: true
logging:
  level: INFO
  save_to_file: true
  log_file: ../logs/training_mobilenet_v3_large.log
