# Training Configuration File (MobileNetV3-Small)

model:
  architecture: "mobilenetv3_small" # Supported mobile comparison architecture
  input_shape: [224, 224, 3]
  num_classes: 72
  weights: "imagenet"
  dropout_rate: 0.5
  classifier_units: 256
  # Normalize image tensors in the dataset pipeline to [-1, 1].
  include_preprocessing: false

dataset:
  data_dir: "../dataset/processed"
  train_dir: "../dataset/processed/train"
  val_dir: "../dataset/processed/val"
  test_dir: "../dataset/processed/test"
  batch_size: 128
  batch_size_fallbacks: [128, 64, 32, 16]
  auto_batch_fallback: true
  shuffle_buffer: 1000
  cache_mode: "memory"
  cache_memory_limit_gb: 8.0

augmentation:
  rotation_range: 25
  zoom_range: [0.9, 1.1]
  horizontal_flip: true
  vertical_flip: true
  brightness_range: [0.9, 1.1]
  class_aware:
    enabled: true
    # The cap-500 benchmark tops out at 350 training images per class, so a
    # cutoff of 500 marked every class minority and disabled the baseline
    # augmentation. 100 reserves the strong policy for the true Guava classes.
    max_train_samples: 100
    rotation_range: 20
    zoom_range: [0.9, 1.1]
    horizontal_flip: true
    vertical_flip: true
    contrast_range: 0.15
    brightness_range: [0.85, 1.15]

training:
  fine_tuning:
    enabled: true
  # Recipe v2 (2026-11): the class-balanced cap-500 benchmark reached
  # val_acc ~0.77 in 15 epochs while val_loss was still improving at the
  # cutoff, and the previous fine-tune LR (5e-6, pre-decayed to 5e-8) moved
  # val_loss by <1% relative. 20 frozen epochs complete the cosine anneal
  # and 10 fine-tune epochs now start at a real 2e-5.
  epochs: 30
  log_mode: progress # Options: summary (one line per epoch) or progress (live batches)
  freeze_base: true
  unfreeze_from_layer: 100
  unfreeze_epoch: 20
  fine_tune_learning_rate: 2.0e-05

optimizer:
  name: "adam"
  learning_rate: 0.0003
  beta_1: 0.9
  beta_2: 0.999
  epsilon: 1.0e-7
  clipnorm: 1.0
  decay: 0.0

lr_schedule:
  type: "cosine_decay"
  decay_epochs: 20 # Match the frozen-head phase; fine-tuning restarts its own curve
  alpha: 0.01

loss:
  # The capped benchmark is class-balanced, so plain cross-entropy with label
  # smoothing beats focal loss: focal (alpha=0.25) suppresses true-positive
  # gradients without correcting any imbalance, and under-trained the head.
  name: "categorical_crossentropy"
  label_smoothing: 0.1

class_weights:
  enabled: true
  auto_compute: true
  max_weight: 5.0
  normalize: true

callbacks:
  checkpoint:
    run_scoped: true
    enabled: true
    monitor: "val_loss"
    save_best_only: true
    save_weights_only: true
    mode: "min"
    save_freq: "epoch"
  early_stopping:
    enabled: true
    monitor: "val_loss"
    patience: 6
    restore_best_weights: true
    mode: "min"
  fine_tuning_early_stopping:
    enabled: true
    monitor: "val_loss"
    patience: 6
    restore_best_weights: true
    mode: "min"
  tensorboard:
    enabled: true
    log_dir: "../logs"
    histogram_freq: 0
    write_graph: true
    write_images: false
    update_freq: "epoch"
  csv_logger:
    enabled: true
    filename: "../results/training_log_mobilenetv3_small.csv"
    append: false

export:
  save_dir: "../models"
  formats: ["h5", "saved_model", "tflite"]
  sync_flutter_labels: false

metrics:
  - "accuracy"

performance:
  validate_dataset_splits: true
  mixed_precision: true
  steps_per_execution: 32
  jit_compile: true
  deterministic: false
  distribution: auto
  log_throughput: true
  finite_batch_check: true
  terminate_on_nan: true

seed: 42

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  save_to_file: true
  log_file: "../logs/training_mobilenetv3_small.log"
