# Training Configuration File (ShuffleNetV2 0.5x)

model:
  architecture: "shufflenetv2_05"
  input_shape: [224, 224, 3]
  num_classes: 45
  # Native project implementation; ImageNet weights are intentionally unavailable.
  weights: null
  dropout_rate: 0.35
  classifier_units: 256

dataset:
  data_dir: "../dataset/processed"
  train_dir: "../dataset/processed/train"
  val_dir: "../dataset/processed/val"
  test_dir: "../dataset/processed/test"
  batch_size: 128
  batch_size_fallbacks: [128, 64, 32]
  auto_batch_fallback: true
  shuffle_buffer: 1000
  cache_mode: "auto"
  cache_memory_limit_gb: 8.0

augmentation:
  rotation_range: 15
  zoom_range: [0.95, 1.05]
  horizontal_flip: true
  vertical_flip: true
  brightness_range: [0.9, 1.1]

training:
  # The backbone is randomly initialized, so it must train from epoch one.
  epochs: 50
  freeze_base: false
  unfreeze_from_layer: 0
  unfreeze_epoch: 0
  fine_tune_learning_rate: 0.0001
  fine_tune_optimizer:
    name: "sgd"
    momentum: 0.9
    decay: 1.0e-5

optimizer:
  name: "adam"
  learning_rate: 0.001
  beta_1: 0.9
  beta_2: 0.999
  epsilon: 1.0e-7
  clipnorm: 1.0
  decay: 0.0

lr_schedule:
  type: "reduce_on_plateau"
  monitor: "val_loss"
  factor: 0.5
  patience: 5
  min_lr: 1.0e-7

loss:
  name: "categorical_crossentropy"

class_weights:
  enabled: true
  auto_compute: true
  max_weight: 5.0

callbacks:
  checkpoint:
    enabled: true
    monitor: "val_accuracy"
    save_best_only: true
    save_weights_only: true
    mode: "max"
    save_freq: "epoch"
  early_stopping:
    enabled: true
    monitor: "val_loss"
    patience: 8
    restore_best_weights: true
    mode: "min"
  tensorboard:
    enabled: true
    log_dir: "../logs"
    histogram_freq: 0
    write_graph: true
    write_images: false
    update_freq: "epoch"
  csv_logger:
    enabled: true
    filename: "../results/training_log_shufflenetv2_05.csv"
    append: false

export:
  save_dir: "../models"
  formats: ["h5", "saved_model", "tflite"]
  sync_flutter_labels: false

metrics:
  - "accuracy"

performance:
  mixed_precision: true
  steps_per_execution: 32
  jit_compile: false
  deterministic: false
  distribution: auto
  log_throughput: true
  finite_batch_check: true
  terminate_on_nan: true

seed: 42

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  save_to_file: true
  log_file: "../logs/training_shufflenetv2_05.log"
