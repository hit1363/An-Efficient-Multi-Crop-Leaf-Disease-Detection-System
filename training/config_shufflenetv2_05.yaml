# Training Configuration File (ShuffleNetV2 0.5x)

model:
  architecture: "shufflenetv2_05"
  input_shape: [224, 224, 3]
  num_classes: 72
  # Native project implementation; ImageNet weights are intentionally unavailable.
  weights: null
  dropout_rate: 0.25
  classifier_units: 256

dataset:
  data_dir: "../dataset/processed"
  train_dir: "../dataset/processed/train"
  val_dir: "../dataset/processed/val"
  test_dir: "../dataset/processed/test"
  batch_size: 128
  batch_size_fallbacks: [128, 64, 32, 16]
  auto_batch_fallback: true
  shuffle_buffer: 1000
  cache_mode: "memory"
  cache_memory_limit_gb: 8.0

augmentation:
  # Recipe v3: a randomly initialized backbone underfits train if every image
  # is rotated 25 degrees each epoch, so the baseline is gentler.
  rotation_range: 15
  zoom_range: [0.9, 1.1]
  horizontal_flip: true
  vertical_flip: true
  brightness_range: [0.9, 1.1]
  class_aware:
    enabled: true
    # Recipe v3: the cap-500 benchmark tops out at 350 training images, so the
    # old cutoff of 500 marked *all* 72 classes as minority and replaced the
    # baseline policy everywhere. 100 leaves only the true Guava minorities.
    max_train_samples: 100
    rotation_range: 20
    zoom_range: [0.9, 1.1]
    horizontal_flip: true
    vertical_flip: true
    contrast_range: 0.15
    brightness_range: [0.85, 1.15]

training:
  fine_tuning:
    enabled: true
  # The backbone is randomly initialized, so it must train from epoch one.
  # Recipe v3 (2026-11): 30 epochs at a 25-degree baseline with a 500-sample
  # minority cutoff stalled after epoch 7 (epoch 1 held the best val_loss and
  # early stopping restored it). The schedule is now long enough for a
  # from-scratch backbone with three warmup epochs.
  # Recipe v4 (2026-11): v3's peak LR of 1e-3 destabilized the from-scratch
  # backbone — train accuracy peaked at ~14% around epoch 9 then declined
  # while val_accuracy hovered at random (ln(72) uniform-prior floor). The
  # peak drops to 3e-4 with a small Adam weight decay, and early stopping's
  # min_delta shrinks so real sub-0.5pp gains still reset the patience.
  epochs: 40
  log_mode: progress # Options: summary (one line per epoch) or progress (live batches)
  freeze_base: false
  unfreeze_from_layer: 0
  unfreeze_epoch: 0
  fine_tune_learning_rate: 0.0001
  fine_tune_optimizer:
    name: "sgd"
    momentum: 0.9
    decay: 1.0e-5

optimizer:
  name: "adam"
  learning_rate: 0.0003
  beta_1: 0.9
  beta_2: 0.999
  epsilon: 1.0e-7
  clipnorm: 1.0
  # Small Adam weight decay stabilizes the from-scratch backbone; 0.0 let the
  # weights wander at high LR (train accuracy declining after epoch 9).
  decay: 1.0e-5

lr_schedule:
  type: "cosine_decay"
  decay_epochs: 40 # Single training phase (backbone trains from epoch one)
  alpha: 0.01
  # Recipe v3: full LR from step zero made val_loss exceed the uniform-prior
  # ln(72) ~= 4.28; ramp 1e-4 -> the peak over three epochs before the cosine.
  # Recipe v4 keeps the 3-epoch ramp (1e-4 -> 3e-4) and the 40-epoch cosine.
  warmup_epochs: 3
  warmup_start_lr: 0.0001

loss:
  # Balanced cap-500 benchmark: cross-entropy + label smoothing replaces
  # focal loss (which suppressed gradients without correcting any imbalance).
  name: "categorical_crossentropy"
  label_smoothing: 0.1

class_weights:
  enabled: true
  auto_compute: true
  max_weight: 5.0
  normalize: true

callbacks:
  checkpoint:
    run_scoped: true
    enabled: true
    # Recipe v3: val_loss is a fluke-prone signal for a from-scratch backbone
    # (epoch 1's random-level loss beat every later epoch in Recipe v2).
    monitor: "val_accuracy"
    save_best_only: true
    save_weights_only: true
    mode: "max"
    save_freq: "epoch"
  early_stopping:
    enabled: true
    monitor: "val_accuracy"
    patience: 10
    # Recipe v4: 0.005 was coarser than the epoch-to-epoch val_accuracy gains
    # of a from-scratch backbone, so genuine progress burned patience.
    min_delta: 0.001
    restore_best_weights: true
    mode: "max"
  fine_tuning_early_stopping:
    enabled: true
    monitor: "val_loss"
    patience: 6
    restore_best_weights: true
    mode: "min"
  tensorboard:
    enabled: true
    log_dir: "../logs"
    histogram_freq: 0
    write_graph: true
    write_images: false
    update_freq: "epoch"
  csv_logger:
    enabled: true
    filename: "../results/training_log_shufflenetv2_05.csv"
    append: false

export:
  save_dir: "../models"
  formats: ["h5", "saved_model", "tflite"]
  sync_flutter_labels: false

metrics:
  - "accuracy"
  - "top_k_categorical_accuracy"

performance:
  validate_dataset_splits: true
  mixed_precision: true
  steps_per_execution: 8
  jit_compile: true
  deterministic: false
  distribution: auto
  log_throughput: true
  finite_batch_check: true
  terminate_on_nan: true

seed: 42

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  save_to_file: true
  log_file: "../logs/training_shufflenetv2_05.log"
