# Training Configuration File (MobileNetV2)

# Model Settings
model:
  architecture: "mobilenetv2" # Options: mobilenetv2, efficientnet_b0, efficientnet_lite0, mobilenetv3_small, shufflenetv2_05
  input_shape: [224, 224, 3]
  num_classes: 45
  weights: "imagenet" # Use ImageNet pre-trained weights
  dropout_rate: 0.35
  classifier_units: 256

# Dataset Settings
dataset:
  data_dir: "../dataset/processed"
  train_dir: "../dataset/processed/train"
  val_dir: "../dataset/processed/val"
  test_dir: "../dataset/processed/test"
  batch_size: 128
  batch_size_fallbacks: [128, 64, 32]
  auto_batch_fallback: true
  shuffle_buffer: 1000
  cache_mode: "auto" # RAM when safe; otherwise hosted-disk cache
  cache_memory_limit_gb: 8.0

# Data Augmentation
augmentation:
  rotation_range: 15
  zoom_range: [0.95, 1.05]
  horizontal_flip: true
  vertical_flip: true
  brightness_range: [0.9, 1.1]

# Training Settings
training:
  epochs: 35
  freeze_base: true
  unfreeze_from_layer: 100 # Keep early generic features frozen
  unfreeze_epoch: 5 # Train the head briefly before fine-tuning
  fine_tune_learning_rate: 0.00005
  fine_tune_optimizer:
    name: "sgd"
    momentum: 0.9
    clipnorm: 1.0
    decay: 1.0e-5

# Optimizer Settings
optimizer:
  name: "adam" # Options: adam, sgd, rmsprop
  learning_rate: 0.001
  beta_1: 0.9
  beta_2: 0.999
  epsilon: 1.0e-7
  clipnorm: 1.0
  decay: 0.0

# Learning Rate Schedule
# type: reduce_on_plateau (default) | exponential_decay | cosine_decay
#   reduce_on_plateau: uses factor, patience, min_lr (above)
#   exponential_decay: uses decay_epochs, decay_rate, staircase
#   cosine_decay:     uses decay_epochs, alpha (minimum LR fraction)
lr_schedule:
  type: "reduce_on_plateau" # Options: reduce_on_plateau, exponential_decay, cosine_decay
  monitor: "val_loss"
  factor: 0.5
  patience: 5
  min_lr: 1.0e-7
  # For exponential_decay:
  # decay_epochs: 35
  # decay_rate: 0.96
  # staircase: false
  # For cosine_decay:
  # decay_epochs: 35
  # alpha: 0.0

# Loss Function
loss:
  name: "categorical_crossentropy" # Options: categorical_crossentropy, focal_loss
  # For focal_loss only:
  # gamma: 2.0        # focusing parameter (higher = more focus on hard examples)
  # alpha: 0.25       # weight-balancing parameter
  # label_smoothing: 0.0

# Class Weights (for imbalanced dataset)
class_weights:
  enabled: true
  auto_compute: true # Automatically compute from dataset
  max_weight: 5.0

# Callbacks
callbacks:
  # Model Checkpoint
  checkpoint:
    enabled: true
    monitor: "val_accuracy"
    save_best_only: true
    save_weights_only: true
    mode: "max"
    save_freq: "epoch"

  # Early Stopping
  early_stopping:
    enabled: true
    monitor: "val_loss"
    patience: 7
    restore_best_weights: true
    mode: "min"

  # TensorBoard
  tensorboard:
    enabled: true
    log_dir: "../logs"
    histogram_freq: 0
    write_graph: true
    write_images: false
    update_freq: "epoch"

  # CSV Logger
  csv_logger:
    enabled: true
    filename: "../results/training_log_mobilenetv2.csv"
    append: false

# Model Export
export:
  save_dir: "../models"
  formats: ["h5", "saved_model", "tflite"]
  sync_flutter_labels: false

# Evaluation Metrics
metrics:
  - "accuracy"

# Runtime performance. Mixed precision and batched execution are especially
# effective for MobileNetV2 on Kaggle GPUs. Set mixed_precision to false for CPU.
performance:
  mixed_precision: true
  steps_per_execution: 32
  jit_compile: false
  deterministic: false
  distribution: auto
  log_throughput: true
  finite_batch_check: true
  terminate_on_nan: true

# Reproducibility
seed: 42

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  save_to_file: true
  log_file: "../logs/training_mobilenetv2.log"
