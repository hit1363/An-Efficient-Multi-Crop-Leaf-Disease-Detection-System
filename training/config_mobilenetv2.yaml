# Training Configuration File (MobileNetV2)

# Model Settings
model:
  architecture: "mobilenetv2" # Options: mobilenetv2, efficientnet_b0, efficientnet_lite0
  input_shape: [224, 224, 3]
  num_classes: 72
  weights: "imagenet" # Use ImageNet pre-trained weights
  dropout_rate: 0.5
  head_units: [256, 128]
  l2_regularization: 0.0001

# Dataset Settings
dataset:
  data_dir: "../dataset/processed"
  train_dir: "../dataset/processed/train"
  val_dir: "../dataset/processed/val"
  test_dir: "../dataset/processed/test"
  batch_size: 32
  shuffle_buffer: 1000
  cache_mode: "none"
  audit:
    enabled: true # Blocks training on class-order mismatches or cross-split duplicates

# Data Augmentation
augmentation:
  rotation_range: 25
  zoom_range: [0.9, 1.1]
  horizontal_flip: true
  vertical_flip: true
  brightness_range: [0.9, 1.1]

# Training Settings
training:
  epochs: 24
  freeze_base: true
  unfreeze_from_layer: 130 # Fine-tune only the final MobileNetV2 tail
  unfreeze_epoch: 8 # Train the classifier head before fine-tuning the backbone
  fine_tune_learning_rate: 0.000005

# Optimizer Settings
optimizer:
  name: "adam" # Options: adam, sgd, rmsprop
  learning_rate: 0.0003
  beta_1: 0.9
  beta_2: 0.999
  epsilon: 1.0e-7
  decay: 0.0
  clipnorm: 1.0

# Learning Rate Schedule
# type: reduce_on_plateau (default) | exponential_decay | cosine_decay
#   reduce_on_plateau: uses factor, patience, min_lr (above)
#   exponential_decay: uses decay_steps, decay_rate, staircase
#   cosine_decay:     uses decay_steps, alpha (minimum LR fraction)
lr_schedule:
  type: "reduce_on_plateau" # Options: reduce_on_plateau, exponential_decay, cosine_decay
  monitor: "val_loss"
  factor: 0.5
  patience: 2
  min_lr: 1.0e-7
  # For exponential_decay:
  # decay_steps: 1000
  # decay_rate: 0.96
  # staircase: false
  # For cosine_decay:
  # decay_steps: 1000
  # alpha: 0.0

# Loss Function
loss:
  name: "categorical_crossentropy" # Options: categorical_crossentropy, focal_loss
  # For focal_loss only:
  # gamma: 2.0        # focusing parameter (higher = more focus on hard examples)
  # alpha: 0.25       # weight-balancing parameter
  # label_smoothing: 0.0

# Class Weights (for imbalanced dataset)
class_weights:
  enabled: true # Capped, normalized weights improve minority-class recall
  auto_compute: true # Automatically compute from dataset
  max_weight: 3.0 # Used only when class weights are enabled
  normalize: true # Keep the sample-weighted mean at one after clipping

# Callbacks
callbacks:
  # Model Checkpoint
  checkpoint:
    enabled: true
    monitor: "val_loss"
    save_best_only: true
    save_weights_only: false
    mode: "min"
    save_freq: "epoch"

  # Early Stopping
  early_stopping:
    enabled: true
    monitor: "val_loss"
    patience: 4
    restore_best_weights: true
    mode: "min"

  # TensorBoard
  tensorboard:
    enabled: true
    log_dir: "../logs"
    histogram_freq: 1
    write_graph: true
    write_images: false
    update_freq: "epoch"

  # CSV Logger
  csv_logger:
    enabled: true
    filename: "../results/training_log_mobilenetv2.csv"
    append: false

# Model Export
export:
  save_dir: "../models"
  formats: ["h5", "saved_model", "tflite"]
  sync_flutter_labels: false

# Evaluation Metrics
metrics:
  - "accuracy"
  - "precision"
  - "recall"
  - "auc"

# Evaluate the validation-selected checkpoint on the test split exactly once.
evaluation:
  run_after_training: true
  results_dir: "../results/mobilenetv2_evaluation"

# Reproducibility
seed: 42

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  save_to_file: true
  log_file: "../logs/training_mobilenetv2.log"
