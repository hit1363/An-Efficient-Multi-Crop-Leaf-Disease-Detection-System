# Training Configuration File (MobileNetV2)

# Model Settings
model:
  architecture: "mobilenetv2" # Options: mobilenetv2, efficientnet_b0, efficientnet_v2_b0, mobilenetv3_small, shufflenetv2_05
  input_shape: [224, 224, 3]
  num_classes: 72
  weights: "imagenet" # Use ImageNet pre-trained weights
  dropout_rate: 0.5
  classifier_units: 256
  head_units: [256, 128]
  l2_regularization: 0.0001

# Dataset Settings
dataset:
  data_dir: "../dataset/processed"
  train_dir: "../dataset/processed/train"
  val_dir: "../dataset/processed/val"
  test_dir: "../dataset/processed/test"
  batch_size: 128
  batch_size_fallbacks: [128, 64, 32, 16]
  auto_batch_fallback: true
  shuffle_buffer: 1000
  cache_mode: "memory"
  cache_memory_limit_gb: 8.0

# Data Augmentation
augmentation:
  rotation_range: 25
  zoom_range: [0.9, 1.1]
  horizontal_flip: true
  vertical_flip: true
  brightness_range: [0.9, 1.1]
  class_aware:
    enabled: true
    # The cap-500 benchmark tops out at 350 training images per class, so a
    # cutoff of 500 marked every class minority and disabled the baseline
    # augmentation. 100 reserves the strong policy for the true Guava classes.
    max_train_samples: 100
    rotation_range: 20
    zoom_range: [0.9, 1.1]
    horizontal_flip: true
    vertical_flip: true
    contrast_range: 0.15
    brightness_range: [0.85, 1.15]

# Training Settings
training:
  # Recipe v4 (2026-11): 20 frozen epochs + 16 fine-tune epochs at a real
  # 2e-5. The extra six fine-tune epochs buy the same tail the EfficientNetB0
  # baseline needed to clear 87%.
  epochs: 36
  log_mode: progress # Options: summary (one line per epoch) or progress (live batches)
  freeze_base: true
  unfreeze_from_layer: 130 # Keep early generic features frozen
  unfreeze_epoch: 20
  fine_tune_learning_rate: 2.0e-05
  fine_tuning:
    enabled: true

# Optimizer Settings
optimizer:
  name: "adam" # Options: adam, sgd, rmsprop
  learning_rate: 0.0003
  beta_1: 0.9
  beta_2: 0.999
  epsilon: 1.0e-7
  clipnorm: 1.0
  decay: 0.0

# Learning Rate Schedule
# type: reduce_on_plateau (default) | exponential_decay | cosine_decay
#   reduce_on_plateau: uses factor, patience, min_lr (above)
#   exponential_decay: uses decay_epochs, decay_rate, staircase
#   cosine_decay:     uses decay_epochs, alpha (minimum LR fraction)
lr_schedule:
  type: "cosine_decay"
  decay_epochs: 20 # Match the frozen-head phase; fine-tuning restarts its own curve
  alpha: 0.01

# Loss Function
loss:
  # Balanced cap-500 benchmark: cross-entropy + label smoothing replaces
  # focal loss (which suppressed gradients without correcting any imbalance).
  name: "categorical_crossentropy"
  label_smoothing: 0.1

# Class Weights (for imbalanced dataset)
class_weights:
  enabled: true
  auto_compute: true # Automatically compute from dataset
  max_weight: 3.0
  normalize: true

# Callbacks
callbacks:
  # Model Checkpoint
  checkpoint:
    enabled: true
    run_scoped: true
    monitor: "val_loss"
    save_best_only: true
    save_weights_only: true
    mode: "min"
    save_freq: "epoch"

  # Early Stopping
  early_stopping:
    enabled: true
    monitor: "val_loss"
    patience: 6
    restore_best_weights: true
    mode: "min"
  fine_tuning_early_stopping:
    enabled: true
    monitor: "val_loss"
    patience: 6
    restore_best_weights: true
    mode: "min"

  # TensorBoard
  tensorboard:
    enabled: true
    log_dir: "../logs"
    histogram_freq: 0
    write_graph: true
    write_images: false
    update_freq: "epoch"

  # CSV Logger
  csv_logger:
    enabled: true
    filename: "../results/training_log_mobilenetv2.csv"
    append: false

# Model Export
export:
  save_dir: "../models"
  formats: ["h5", "saved_model", "tflite"]
  sync_flutter_labels: false

# Evaluation Metrics
metrics:
  - "accuracy"
  # Macro precision/recall are computed from a running confusion matrix, so they
  # report the same average evaluate.py prints rather than repeating accuracy.
  - "precision"
  - "recall"
  - "auc"

evaluation:
  # Horizontal flip is label-preserving for leaves, so averaging the softmax of
  # the image and its mirror recovers orientation-sensitive misses at the cost
  # of one extra forward pass.
  tta: flip

# Runtime performance. Mixed precision and batched execution are especially
# effective for MobileNetV2 on Kaggle GPUs. Set mixed_precision to false for CPU.
performance:
  validate_dataset_splits: true
  mixed_precision: true
  steps_per_execution: 32
  jit_compile: true
  deterministic: false
  distribution: auto
  log_throughput: true
  finite_batch_check: true
  terminate_on_nan: true

# Reproducibility
seed: 42

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  save_to_file: true
  log_file: "../logs/training_mobilenetv2.log"