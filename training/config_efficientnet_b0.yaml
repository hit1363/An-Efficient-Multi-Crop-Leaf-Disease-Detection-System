# Training Configuration File (EfficientNetB0)

model:
  architecture: "efficientnet_b0"
  input_shape: [224, 224, 3]
  num_classes: 72
  weights: "imagenet"
  dropout_rate: 0.5
  head_units: [256, 128]
  l2_regularization: 0.0001

dataset:
  data_dir: "../dataset/processed_harmonized"
  train_dir: "../dataset/processed_harmonized/train"
  val_dir: "../dataset/processed_harmonized/val"
  test_dir: "../dataset/processed_harmonized/test"
  batch_size: 64
  batch_size_fallbacks: [64, 32, 16]
  auto_batch_fallback: true
  shuffle_buffer: 1000
  cache_mode: "auto"
  cache_memory_limit_gb: 8.0

augmentation:
  rotation_range: 20
  zoom_range: [0.9, 1.1]
  horizontal_flip: true
  vertical_flip: true
  brightness_range: [0.9, 1.1]
  class_aware:
    enabled: true
    max_train_samples: 500
    rotation_range: 20
    zoom_range: [0.9, 1.1]
    horizontal_flip: true
    vertical_flip: true
    contrast_range: 0.15
    brightness_range: [0.85, 1.15]

training:
  epochs: 50
  freeze_base: true
  unfreeze_from_layer: 100
  unfreeze_epoch: 5
  fine_tune_learning_rate: 0.0001
  fine_tuning:
    enabled: true

optimizer:
  name: "adam"
  learning_rate: 0.001
  beta_1: 0.9
  beta_2: 0.999
  epsilon: 1.0e-7
  clipnorm: 1.0
  decay: 0.0

lr_schedule:
  type: "reduce_on_plateau"
  monitor: "val_loss"
  factor: 0.5
  patience: 5
  min_lr: 1.0e-7

loss:
  name: "categorical_crossentropy"

class_weights:
  enabled: true
  auto_compute: true
  max_weight: 5.0
  normalize: true

callbacks:
  checkpoint:
    enabled: true
    run_scoped: true
    monitor: "val_loss"
    save_best_only: true
    save_weights_only: true
    mode: "min"
    save_freq: "epoch"
  early_stopping:
    enabled: true
    monitor: "val_loss"
    patience: 6
    restore_best_weights: true
    mode: "min"
  fine_tuning_early_stopping:
    monitor: "val_loss"
    patience: 6
    mode: "min"
    restore_best_weights: true
  tensorboard:
    enabled: true
    log_dir: "../logs"
    histogram_freq: 1
    write_graph: true
    write_images: false
    update_freq: "epoch"
  csv_logger:
    enabled: true
    filename: "../results/training_log_efficientnet_b0.csv"
    append: false

export:
  save_dir: "../models"
  formats: ["saved_model", "tflite"]
  sync_flutter_labels: false

metrics:
  - "accuracy"
  - "precision"
  - "recall"
  - "auc"

seed: 42

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  save_to_file: true
  log_file: "../logs/training_efficientnet_b0.log"

mlflow:
  enabled: false
  tracking_uri: "http://localhost:5000"
  experiment_name: "multi-crop-disease-detection"

wandb:
  enabled: false
  project: "leaf-disease-detection"
  entity: "your-username"

performance:
  validate_dataset_splits: false
  mixed_precision: true
  steps_per_execution: 32
  jit_compile: true
  deterministic: false
  distribution: auto
  log_throughput: true
  finite_batch_check: true
  terminate_on_nan: true
