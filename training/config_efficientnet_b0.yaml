# Training Configuration File (EfficientNetB0)

model:
  architecture: "efficientnet_b0"
  input_shape: [224, 224, 3]
  num_classes: 72
  weights: "imagenet"
  dropout_rate: 0.5
  head_units: [256, 128]
  l2_regularization: 0.0001

dataset:
  data_dir: "../dataset/processed"
  train_dir: "../dataset/processed/train"
  val_dir: "../dataset/processed/val"
  test_dir: "../dataset/processed/test"
  batch_size: 128
  batch_size_fallbacks: [128, 64, 32, 16]
  auto_batch_fallback: true
  shuffle_buffer: 1000
  cache_mode: "memory"
  cache_memory_limit_gb: 8.0

augmentation:
  rotation_range: 25
  zoom_range: [0.9, 1.1]
  horizontal_flip: true
  vertical_flip: true
  brightness_range: [0.9, 1.1]
  class_aware:
    enabled: true
    # The cap-500 benchmark tops out at 350 training images per class, so a
    # cutoff of 500 marked every class minority and disabled the baseline
    # augmentation. 100 reserves the strong policy for the true Guava classes.
    max_train_samples: 100
    rotation_range: 20
    zoom_range: [0.9, 1.1]
    horizontal_flip: true
    vertical_flip: true
    contrast_range: 0.15
    brightness_range: [0.85, 1.15]

training:
  # Recipe v3 (2026-11): 224x224 native input (Kaggle profile no longer caps
  # b0 at 192), deeper fine-tune from layer 140 (1.26x the trainable backbone of
  # the layer-180 baseline: 3.82M vs 3.02M params; BatchNorm stays frozen), and
  # a longer phase 2 (16 epochs) — the 87.1% baseline concentrated its misses in
  # fine-grained rice/sugarcane/tomato clusters that need both resolution and
  # backbone adaptation.
  epochs: 36
  log_mode: progress # Options: summary (one line per epoch) or progress (live batches)
  freeze_base: true
  unfreeze_from_layer: 140
  unfreeze_epoch: 20
  fine_tune_learning_rate: 2.0e-05
  fine_tuning:
    enabled: true

optimizer:
  name: "adam"
  learning_rate: 0.0003
  beta_1: 0.9
  beta_2: 0.999
  epsilon: 1.0e-7
  clipnorm: 1.0
  decay: 0.0

lr_schedule:
  type: "cosine_decay"
  decay_epochs: 20 # Match the frozen-head phase; fine-tuning restarts its own curve
  alpha: 0.01

loss:
  # Balanced cap-500 benchmark: cross-entropy + label smoothing replaces
  # focal loss (which suppressed gradients without correcting any imbalance).
  name: "categorical_crossentropy"
  label_smoothing: 0.1

class_weights:
  enabled: true
  auto_compute: true
  max_weight: 5.0
  normalize: true

callbacks:
  checkpoint:
    enabled: true
    run_scoped: true
    monitor: "val_loss"
    save_best_only: true
    save_weights_only: true
    mode: "min"
    save_freq: "epoch"
  early_stopping:
    enabled: true
    monitor: "val_loss"
    patience: 6
    restore_best_weights: true
    mode: "min"
  fine_tuning_early_stopping:
    enabled: true
    monitor: "val_loss"
    patience: 6
    restore_best_weights: true
    mode: "min"
  tensorboard:
    enabled: true
    log_dir: "../logs"
    histogram_freq: 1
    write_graph: true
    write_images: false
    update_freq: "epoch"
  csv_logger:
    enabled: true
    filename: "../results/training_log_efficientnet_b0.csv"
    append: false

export:
  save_dir: "../models"
  formats: ["saved_model", "tflite"]
  sync_flutter_labels: false

metrics:
  - "accuracy"
  # Macro precision/recall are computed from a running confusion matrix, so they
  # report the same average evaluate.py prints rather than repeating accuracy.
  - "precision"
  - "recall"
  - "auc"

evaluation:
  # Horizontal flip is label-preserving for leaves, so averaging the softmax of
  # the image and its mirror recovers orientation-sensitive misses (the 87.1%
  # baseline's errors clustered in rice/sugarcane/tomato lesions) at the cost of
  # one extra forward pass. evaluate.py also accepts --tta to override this.
  tta: "flip"

seed: 42

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  save_to_file: true
  log_file: "../logs/training_efficientnet_b0.log"

mlflow:
  enabled: false
  tracking_uri: "http://localhost:5000"
  experiment_name: "multi-crop-disease-detection"

wandb:
  enabled: false
  project: "leaf-disease-detection"
  entity: "your-username"

performance:
  validate_dataset_splits: true
  mixed_precision: true
  steps_per_execution: 32
  jit_compile: true
  deterministic: false
  distribution: auto
  log_throughput: true
  finite_batch_check: true
  terminate_on_nan: true
